[project]
name = "Hayaati"
version = "1.2.0"
description = "Plateforme d'Audits Patrimoniaux et Vigilance Doctrinale Sharia-Compliant"
authors = [
    { name = "Hayaati Support", email = "aboudourazak@gmail.com" }
]
dependencies = [
    "flet==0.86.2",
    "reportlab>=4.1.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.4.2",
    "cryptography>=42.0.0",
    "plyer>=2.1.0",
    "adhan>=1.2.0",
    "flet-android-notifications>=0.1.0"
]
requires-python = ">=3.10"

[tool.flet]
app_name = "Hayaati"
description = "Calculs Rituels de Zakat & Successions Vivantes"
package_name = "app.hayaati.ritual"
company_name = "Hayaati"
version = "1.2.0"
build_number = 1
icon = "assets/icon.png"

[tool.flet.android]
icon = "assets/icon.png"
adaptive_icon_background = "#FFFFFF"
target_sdk_version = "34"
ndk_version = "26.1.10909125"

# =========================================================================
# 🎯 PERMISSIONS ANDROID — SYNTAXE OFFICIELLE FLET (paires clé=valeur)
# =========================================================================
# NE PAS utiliser une liste de strings. Chaque permission = true/false.
# Cela génère <uses-permission android:name="..." /> dans AndroidManifest.xml
# -------------------------------------------------------------------------
[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.WRITE_EXTERNAL_STORAGE" = true
"android.permission.READ_EXTERNAL_STORAGE" = true
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.MANAGE_DOCUMENTS" = true
"android.permission.SCHEDULE_EXACT_ALARM" = true
"android.permission.RECEIVE_BOOT_COMPLETED" = true
"android.permission.WAKE_LOCK" = true
"android.permission.FOREGROUND_SERVICE" = true
"android.permission.FOREGROUND_SERVICE_SPECIAL_USE" = true

# 🎯 CONFIGURATION NATIVE DE BUNDLE D'ACTIFS POUR FLET BUILD
[tool.flet.bundle]
include = [
    "assets/icon.png",
    "assets/images/**/*",
    "assets/fonts/**/*",
    "assets/locales/**/*",
    "core/hayaati_private.db"
]
