name: al_ansar
description: Module Al Ansâr de HAYAATI (annuaire, cours, mosquées proches), léger et hors ligne d'abord.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  hayaati_ui:
    path: ../hayaati_ui
  http: ^1.2.0
  crypto: ^3.0.3
  path_provider: ^2.1.0
  url_launcher: ^6.2.0
  geolocator: ">=13.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  # Polices (Noto Sans Arabic, signes) et icône de marque : voir le paquet hayaati_ui.
  uses-material-design: true
