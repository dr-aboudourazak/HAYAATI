name: hayaati_ui
description: Charte graphique commune de HAYAATI (palette, thème, polices arabes, composants de base).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  assets:
    - assets/images/Icone-Hayaati.png
  # Polices communes (licence OFL, voir assets/fonts/OFL.txt) : arabe vocalisé et signes ۩ ۞ ﷺ.
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
    - family: HayaatiSignes
      fonts:
        - asset: assets/fonts/HayaatiSignes-Regular.ttf
