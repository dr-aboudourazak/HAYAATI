name: hayaati_exemple
description: Application d'exemple en Flutter pur (sans Flet ni Python) qui héberge Al Ansâr, Madrassa et le Coran pour les tester vite.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  al_ansar:
    path: ../al_ansar_flutter
  hayaati_coran:
    path: ../hayaati_coran
  hayaati_ui:
    path: ../hayaati_ui
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Copiés depuis HAYAATI (fichiers de langue) et depuis l'extension (données d'Al Ansâr) par appliquer_lot_c.py.
    - assets/locales/
    - assets/al_ansar/
